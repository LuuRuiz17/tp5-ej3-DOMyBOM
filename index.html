<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Práctica de DOM y BOM" />
    <meta name="keywords" content="DOM, BOM, JavaScript" />
    <meta name="author" content="Lucina Ruiz" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Ejercicio 3</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
          <a class="navbar-brand" href="index.html"
            ><strong>Práctica DOM</strong></a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="collapse navbar-collapse justify-content-end"
            id="navbarSupportedContent"
          ></div>
        </div>
      </nav>
    </header>
    <main class="container">
      <h3 class="text-center mt-3">Agregar Tareas con JS 📚</h3>
      <section class="mx-3 mb-5">
        <form id="formularioTareas" class="mt-3 mx-auto">
          <div class="row g-2">
            <div class="col-12 col-md-9">
              <input
                type="text"
                class="form-control mt-lg-4"
                id="tareaInput"
                placeholder="Ej: Realizar el TP de DOM y BOM"
              />
            </div>
            <div class="col-12 col-md-3">
              <button type="submit" class="btn btn-success w-100 mt-3 mt-lg-4 mt-md-0 ms-lg-3">
                Agregar tarea
              </button>
            </div>
          </div>
        </form>
        <ul class="list-group mt-4 w-100"></ul>
      </section>
    </main>
    <footer class="bg-dark-subtle text-center">
      <p class="py-4">&copy Todos los derechos reservados.</p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"
